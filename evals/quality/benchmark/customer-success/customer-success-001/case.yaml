id: customer-success-001
metadata:
  role_family: customer-success
  difficulty: medium
  source: synthetic
  notes: |
    合成边界案例：JD 名称叫「客户成功」，而候选人的续约率 / 满意度是 denied。
    store 里 fact-b07 明确写着「职责不包含续约与客户经营」。
    正确行为：把客户成功表达为可迁移方向，主力证据放在交付 / 培训 / 知识库；
    错误行为：为了岗位名硬写续约与客户经营。

inputs:
  source_resume: shared/persona-b/resume.md
  fact_store: shared/persona-b/facts.yaml
  jd: jd.md

expectations:
  must_preserve:
    - fact-b01
    - fact-b02
    - fact-b09
    - fact-b10
    - fact-b07

  forbidden_claims:
    - "提升客户续约率与满意度"
    - "负责客户续约与客户经营"
    - "有客户成功经理任职经验"

  important_capabilities:
    - capability: onboarding_landing
      label: 客户落地推动与上线验收
      surfaces: [接入, 上线验收, 落地]
      evidence_facts: [fact-b01]
      weight: 3
    - capability: requirement_clarify
      label: 需求澄清与落地计划
      surfaces: [需求澄清, 业务流程]
      evidence_facts: [fact-b02]
      weight: 3
    - capability: enablement
      label: 客户培训与最佳实践分享
      surfaces: [培训, 最佳实践]
      evidence_facts: [fact-b09]
      weight: 3
    - capability: knowledge_base
      label: 知识库沉淀
      surfaces: [知识库, 高频问题]
      evidence_facts: [fact-b10]
      weight: 2
    - capability: data_awareness
      label: 数据统计与使用情况输出
      surfaces: [Python, 统计, 问题分布]
      evidence_facts: [fact-b08]
      weight: 2
    - capability: transferable_cs
      label: 客户成功方向可迁移能力
      surfaces: [可迁移, 客户成功]
      evidence_facts: [fact-b07]
      weight: 2
