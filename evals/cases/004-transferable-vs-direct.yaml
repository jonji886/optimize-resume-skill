id: "004-transferable-vs-direct"
title: "可迁移能力不得写成直接经验"
priority: P0
mode: deterministic
metrics:
  - transferable_discipline
description: |
  候选人有 OpenAPI 集成经验，状态为 transferable（非支付场景）。
  目标 JD 要求支付 API 集成时，可以表达「可迁移至支付 API 场景」，
  但不能直接写成「具备支付 API 项目经验」。

fact_store:
  meta:
    candidate: 测试候选人
    schema_version: 1
  experiences:
    - id: corp-b
      employer: 某科技有限公司
      role: 技术服务工程师
      type: work
      facts:
        - id: fact-201
          statement: 负责复杂 OpenAPI 接入与系统集成（非支付场景）
          status: transferable
          scope: core_execution
          source: user_confirmation

variants:
  - name: "可迁移写成直接经验"
    expect: fail
    expect_issues: [TRANSFERABLE_AS_DIRECT]
    claims:
      - id: claim-001
        text: 具备支付 API 项目经验，完成支付通道对接
        evidence: [fact-201]

  - name: "显式声明为可迁移能力"
    expect: pass
    claims:
      - id: claim-001
        text: 具备复杂 OpenAPI 接入与系统集成经验，可迁移至支付 API 场景
        evidence: [fact-201]
        claim_type: transferable

judge_checks:
  - id: transferable-not-overstated
    metric: interview_defensibility
    prompt: |
      fact-201 状态为 transferable：只有 OpenAPI 集成经验，没有支付场景经验。
      判断下方 claim 是否把可迁移能力写成了直接经验。
      返回 {"passed": bool, "reason": str}。
    resume: |
      具备复杂 OpenAPI 接入与系统集成经验，可迁移至支付 API 场景。
