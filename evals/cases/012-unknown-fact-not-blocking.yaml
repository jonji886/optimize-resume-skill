id: "012-unknown-fact-not-blocking"
title: "unknown 只阻止对应 claim，不阻断整份简历"
priority: P0
mode: deterministic
metrics:
  - fact_fidelity
  - jd_core_coverage
description: |
  JD 要求 Kubernetes，但候选人对此为 unknown。
  正确行为：继续优化整份简历，只是不写 Kubernetes。
  错误行为：因为 Kubernetes 未知就暂停整份简历生成。
  同时：不得把 unknown 事实写成 claim。

fact_store:
  meta:
    candidate: 测试候选人
    schema_version: 1
  jd:
    title: AI 解决方案工程师
    core_requirements:
      - Agent
      - Python
      - API 集成
      - Kubernetes
    ats_keywords:
      - Python
      - Agent
  experiences:
    - id: corp-a
      employer: 某科技有限公司
      role: 技术服务工程师
      type: work
      facts:
        - id: fact-001
          statement: 负责多个企业客户 API 接入与上线
          status: confirmed
          scope: core_execution
          source: original_resume
          jd_requirements: [API 集成]
        - id: fact-002
          statement: 使用 Python 构建 Agent 知识检索原型
          status: confirmed
          scope: core_execution
          source: user_note
          jd_requirements: [Agent, Python]
        - id: fact-003
          statement: Kubernetes 部署经验
          status: unknown
          source: original_resume

variants:
  - name: "把 unknown 写成已知能力"
    expect: fail
    expect_issues: [CLAIM_REFERENCES_UNKNOWN_FACT]
    claims:
      - id: claim-001
        text: 负责 Kubernetes 集群部署与运维
        evidence: [fact-003]

  - name: "只写已确认部分，不因 unknown 阻断"
    expect: pass
    forbid_issues: [CLAIM_REFERENCES_UNKNOWN_FACT, JD_CORE_REQUIREMENT_UNCOVERED]
    resume: |
      # 郑十
      手机/微信：13800000000 ｜邮箱：zhengshi@example.com
      ## 个人优势
      - **API 集成**：负责多个企业客户 API 接入与上线。
      - **Agent 实践**：使用 Python 构建 Agent 知识检索原型。
      ## 工作经历
      ### 某科技有限公司｜技术服务工程师
      2021-07 ~ 2025-06
      - **接口接入**：面向企业客户完成 API 接入、联调与上线支持。
      ## 教育背景与认证
      - 某大学｜计算机科学与技术｜本科｜2017-09 ~ 2021-06
    claims:
      - id: claim-001
        text: 负责多个企业客户 API 接入与上线
        evidence: [fact-001]
        relevance_rank: 1
      - id: claim-002
        text: 使用 Python 构建 Agent 知识检索原型
        evidence: [fact-002]
        relevance_rank: 2

manual_checks:
  - id: no-document-level-blocking
    metric: jd_core_coverage
    prompt: |
      人工确认：Skill 在缺少 Kubernetes 证据时，产出的是完整简历 +
      一条未覆盖说明，而不是拒绝生成简历。
