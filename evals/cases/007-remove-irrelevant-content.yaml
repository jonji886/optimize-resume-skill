id: "007-remove-irrelevant-content"
title: "无关经历应压缩，不得挤占 JD 核心 evidence"
priority: P1
mode: deterministic
metrics:
  - irrelevant_content_rate
  - jd_core_coverage
description: |
  候选人有 Agent 与 API 集成的 confirmed 事实，但简历把版面用在行政、
  团建、无关工具上，导致核心 evidence 没有位置。
  deterministic 侧通过「事实支持但未体现」间接捕获这种挤占；
  「是否真的无关」由人工与 judge 判断。

fact_store:
  meta:
    candidate: 测试候选人
    schema_version: 1
  jd:
    title: AI 解决方案工程师
    core_requirements:
      - Agent
      - API 集成
  experiences:
    - id: corp-a
      employer: 某科技有限公司
      role: 技术服务工程师
      type: work
      facts:
        - id: fact-001
          statement: 负责多个企业客户 OpenAPI 接入与上线
          status: confirmed
          scope: core_execution
          source: original_resume
          jd_requirements: [API 集成]
        - id: fact-002
          statement: 使用 RAG 和 Agent 构建内部知识检索原型
          status: confirmed
          scope: core_execution
          source: user_note
          jd_requirements: [Agent]

variants:
  - name: "版面被无关内容占满，核心 evidence 缺席"
    expect: fail
    expect_issues: [JD_CORE_REQUIREMENT_UNCOVERED]
    resume: |
      # 赵六
      手机/微信：13800000000 ｜邮箱：zhaoliu@example.com
      ## 个人优势
      - **团队协作**：积极参与部门团建与内部活动组织。
      - **工作态度**：认真负责，能够承受一定工作压力。
      ## 工作经历
      ### 某科技有限公司｜技术服务工程师
      2021-07 ~ 2025-06
      - **行政支持**：协助整理部门文档、会议室预订与办公用品采购。
      - **活动组织**：组织部门季度团建，协调场地与预算。
      ## 教育背景与认证
      - 某大学｜计算机科学与技术｜本科｜2017-09 ~ 2021-06
    claims:
      - id: claim-001
        text: 积极参与部门团建与内部活动组织
        evidence: []
      - id: claim-002
        text: 协助整理部门文档、会议室预订与办公用品采购
        evidence: []

  - name: "压缩无关内容，核心 evidence 可见"
    expect: pass
    forbid_issues: [JD_CORE_REQUIREMENT_UNCOVERED]
    resume: |
      # 赵六
      手机/微信：13800000000 ｜邮箱：zhaoliu@example.com
      ## 个人优势
      - **API 集成**：负责多个企业客户 OpenAPI 接入与上线，覆盖客户技术对接全流程。
      - **Agent 实践**：使用 RAG 和 Agent 构建内部知识检索原型。
      ## 工作经历
      ### 某科技有限公司｜技术服务工程师
      2021-07 ~ 2025-06
      - **开放平台接入**：负责多个企业客户 OpenAPI 接入与上线。
      ## 教育背景与认证
      - 某大学｜计算机科学与技术｜本科｜2017-09 ~ 2021-06
    claims:
      - id: claim-001
        text: 负责多个企业客户 OpenAPI 接入与上线
        evidence: [fact-001]
        relevance_rank: 1
      - id: claim-002
        text: 使用 RAG 和 Agent 构建内部知识检索原型
        evidence: [fact-002]
        relevance_rank: 2

judge_checks:
  - id: irrelevant-content-judgement
    metric: irrelevant_content_rate
    prompt: |
      JD 核心要求是 Agent 与 API 集成。判断简历中是否存在与目标岗位
      无明显证明作用、却占用版面的内容。返回 {"passed": bool, "reason": str}。
    resume: |
      ## 个人优势
      - **团队协作**：积极参与部门团建与内部活动组织。
      - **工作态度**：认真负责，能够承受一定工作压力。
      ## 工作经历
      - **行政支持**：协助整理部门文档、会议室预订与办公用品采购。
      - **活动组织**：组织部门季度团建，协调场地与预算。
