id: "005-jd-core-coverage"
title: "JD 核心要求必须有事实证据并可见"
priority: P0
mode: deterministic
metrics:
  - jd_core_coverage
description: |
  JD 核心要求（Agent / API 集成 / 客户交付 / Python）在 fact store 中都有
  confirmed 证据。有证据却未在简历中体现，属于覆盖缺口。
  注意：这不等于可以为了覆盖而编造——覆盖必须在事实边界内完成。

fact_store:
  meta:
    candidate: 测试候选人
    schema_version: 1
  jd:
    title: AI 解决方案工程师
    core_requirements:
      - Agent
      - API 集成
      - 客户交付
      - Python
    ats_keywords:
      - Python
      - FastAPI
      - Agent
      - OpenAPI
  experiences:
    - id: corp-a
      employer: 某科技有限公司
      role: 技术服务工程师
      type: work
      facts:
        - id: fact-001
          statement: 负责多个企业客户 OpenAPI 接入与上线，累计支撑 80+ 应用上线
          status: confirmed
          scope: core_execution
          source: original_resume
          jd_requirements: [API 集成, 客户交付]
        - id: fact-002
          statement: 面向企业客户梳理接口依赖与鉴权口径，完成 OpenAPI、Webhook 接入与联调上线
          status: confirmed
          scope: core_execution
          source: original_resume
  projects:
    - id: ai-workbench
      name: AI 技术支持工作台
      type: personal_project
      commercial_delivery: false
      delivery_status: not_delivered
      facts:
        - id: fact-101
          statement: 使用 Python 与 FastAPI 基于 RAG 和 Agent 构建 AI 技术支持工作台
          status: confirmed
          scope: owner
          source: user_note
          jd_requirements: [Agent, Python]

variants:
  - name: "Python 有事实但简历未体现"
    expect: fail
    expect_issues: [JD_CORE_REQUIREMENT_UNCOVERED]
    resume: |
      # 李四
      手机/微信：13800000000 ｜邮箱：lisi@example.com
      ## 个人优势
      - **API 集成**：累计支撑 80+ 企业应用完成开放平台接入与上线，覆盖客户交付全流程。
      - **Agent 实践**：基于 RAG 和 Agent 构建 AI 技术支持工作台。
      ## 工作经历
      ### 某科技有限公司｜技术服务工程师
      2021-07 ~ 2025-06
      - **开放平台接入**：面向企业客户梳理接口依赖与鉴权口径，完成 OpenAPI、Webhook 接入与联调上线。
      ## 教育背景与认证
      - 某大学｜计算机科学与技术｜本科｜2017-09 ~ 2021-06
    claims:
      - id: claim-001
        text: 累计支撑 80+ 企业应用完成开放平台接入与上线，覆盖客户交付全流程
        evidence: [fact-001]
        relevance_rank: 1
      - id: claim-002
        text: 基于 RAG 和 Agent 构建 AI 技术支持工作台
        evidence: [fact-101]
        relevance_rank: 3
      - id: claim-003
        text: 面向企业客户梳理接口依赖与鉴权口径，完成 OpenAPI、Webhook 接入与联调上线
        evidence: [fact-002]
        relevance_rank: 2

  - name: "核心要求全部可见"
    expect: pass
    forbid_issues: [JD_CORE_REQUIREMENT_UNCOVERED, ATS_KEYWORD_MISSING]
    resume: |
      # 李四
      手机/微信：13800000000 ｜邮箱：lisi@example.com
      ## 个人优势
      - **API 集成**：累计支撑 80+ 企业应用完成开放平台接入与上线，覆盖客户交付全流程。
      - **Agent 实践**：使用 Python 与 FastAPI 基于 RAG 和 Agent 构建 AI 技术支持工作台。
      ## 工作经历
      ### 某科技有限公司｜技术服务工程师
      2021-07 ~ 2025-06
      - **开放平台接入**：面向企业客户梳理接口依赖与鉴权口径，完成 OpenAPI、Webhook 接入与联调上线。
      ## 教育背景与认证
      - 某大学｜计算机科学与技术｜本科｜2017-09 ~ 2021-06
    claims:
      - id: claim-001
        text: 累计支撑 80+ 企业应用完成开放平台接入与上线，覆盖客户交付全流程
        evidence: [fact-001]
        relevance_rank: 1
      - id: claim-002
        text: 使用 Python 与 FastAPI 基于 RAG 和 Agent 构建 AI 技术支持工作台
        evidence: [fact-101]
        relevance_rank: 2
      - id: claim-003
        text: 面向企业客户梳理接口依赖与鉴权口径，完成 OpenAPI、Webhook 接入与联调上线
        evidence: [fact-002]
        relevance_rank: 2
