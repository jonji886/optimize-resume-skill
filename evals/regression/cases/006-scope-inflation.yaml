id: "006-scope-inflation"
title: "职责 scope 不得升级"
priority: P0
mode: deterministic
category: safety
metrics:
  - scope_inflation_rate
description: |
  fact store 中两段事实的 scope 均为 support（参与、维护）。
  改写时不得升级为主导、独立负责等更高层级表达。

fact_store:
  meta:
    candidate: 测试候选人
    schema_version: 1
  experiences:
    - id: corp-c
      employer: 某软件公司
      role: 实施工程师
      type: work
      facts:
        - id: fact-301
          statement: 参与客户项目实施与上线支持
          status: confirmed
          scope: support
          source: original_resume
        - id: fact-302
          statement: 维护订单模块并定位线上问题
          status: confirmed
          scope: support
          source: original_resume

variants:
  - name: "参与升级为主导"
    expect: fail
    expect_issues: [SCOPE_INFLATION]
    claims:
      - id: claim-001
        text: 主导客户项目实施与上线
        evidence: [fact-301]

  - name: "支持升级为独立负责"
    expect: fail
    expect_issues: [SCOPE_INFLATION]
    claims:
      - id: claim-001
        text: 独立负责订单模块维护与线上问题定位
        evidence: [fact-302]

  - name: "按 support 层级如实表达"
    expect: pass
    claims:
      - id: claim-001
        text: 协助客户项目实施与上线支持
        evidence: [fact-301]

manual_checks:
  - id: scope-semantic
    metric: interview_defensibility
    prompt: |
      人工复核：面试官追问「这件事你具体做了什么」时，
      候选人能否支撑当前表述的参与层级。
