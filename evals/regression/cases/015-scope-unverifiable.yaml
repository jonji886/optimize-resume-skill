id: "015-scope-unverifiable"
title: "scope 未确认时不得直接使用主导级表达"
priority: P1
mode: deterministic
category: safety
metrics:
  - scope_inflation_rate
  - fact_fidelity
description: |
  fact-601 没有声明 scope（unspecified），说明参与层级尚未确认。
  此时使用「主导」这类高层级表达需要先确认，validator 报 warning，
  而不是默认通过。

fact_store:
  meta:
    candidate: 测试候选人
    schema_version: 1
  experiences:
    - id: corp-d
      employer: 某软件公司
      role: 实施工程师
      type: work
      facts:
        - id: fact-601
          statement: 系统迁移与数据兼容处理
          status: confirmed
          source: original_resume

variants:
  - name: "scope 未确认却使用主导级表达"
    expect: fail
    expect_issues: [SCOPE_UNVERIFIABLE]
    claims:
      - id: claim-001
        text: 主导系统迁移与数据兼容处理
        evidence: [fact-601]

  - name: "scope 未确认时使用中性表达"
    expect: pass
    forbid_issues: [SCOPE_UNVERIFIABLE, SCOPE_INFLATION]
    claims:
      - id: claim-001
        text: 承担系统迁移中的模块改造与数据兼容处理
        evidence: [fact-601]

manual_checks:
  - id: confirm-scope
    metric: scope_inflation_rate
    prompt: |
      人工确认：claim 使用的参与层级动词与用户澄清后的真实 scope 一致；
      确认后应把 scope 回写到 fact store，而不是长期停留在 unspecified。
